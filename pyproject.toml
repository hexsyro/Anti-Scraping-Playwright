[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-scraping-playwright"
version = "2.0.0"
description = "Production-ready anti-blocking web scraping framework for Playwright Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anti-Scraping Playwright Maintainers" }]
dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/hexsyro/Anti-Scraping-Playwright"
Repository = "https://github.com/hexsyro/Anti-Scraping-Playwright"

[tool.setuptools.packages.find]
where = ["."]
include = ["anti_scraping_playwright*"]

[tool.ruff]
# Keep lint results deterministic across ruff versions: newer releases keep
# expanding the default rule set, which would otherwise break CI unexpectedly.
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

